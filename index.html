<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuaderno de ciencia</title>
  <meta name="description" content="Notas, vídeos y una pregunta científica diaria sobre fisiología, dolor y neurociencia.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="barra">
    <div class="barra-in">
      <a class="marca" href="#" id="marca"></a>
      <nav>
        <a href="#temas">Temas</a>
        <a href="#pregunta">Pregunta del día</a>
        <a href="#sobre">Sobre mí</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="cabecera">
      <div class="cabecera-texto">
        <p class="sobretitulo" id="etiqueta"></p>
        <h1 id="titulo"></h1>
        <p class="intro" id="intro"></p>
      </div>

      <aside id="pregunta" class="pregunta" aria-labelledby="pTexto">
        <div class="pregunta-cab">
          <span>Pregunta del día</span>
          <span id="hoy"></span>
        </div>
        <h2 id="pTexto"></h2>
        <ol class="opciones" id="pOpciones"></ol>
        <div class="respuesta" id="pRespuesta" hidden></div>
        <button class="otra" id="pOtra" type="button">Ver otra pregunta</button>
      </aside>
    </section>

    <section id="temas" class="temas">
      <div class="seccion-cab">
        <h2>Temas</h2>
        <div class="filtros" id="filtros" role="tablist"></div>
      </div>
      <div class="rejilla" id="rejilla"></div>
    </section>

    <section id="sobre" class="sobre">
      <h2>Sobre mí</h2>
      <div class="sobre-cuerpo">
        <img id="foto" alt="" hidden>
        <div>
          <p id="sobreMi"></p>
          <ul class="enlaces" id="enlaces"></ul>
        </div>
      </div>
    </section>
  </main>

  <footer><div id="pie"></div></footer>

  <dialog id="modal">
    <button class="cerrar" id="cerrar" aria-label="Cerrar">Cerrar ✕</button>
    <div id="modalCont"></div>
  </dialog>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
